<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FB Location Scrapper</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app">
      <header class="header">
        <div class="header-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
              <path
                d="M12 2C7.58 2 4 5.58 4 10c0 5.25 6.5 11 7.3 11.68a1 1 0 0 0 1.4 0C13.5 21 20 15.25 20 10c0-4.42-3.58-8-8-8z"
                fill="white"
              />
              <circle cx="12" cy="10" r="3.2" fill="#1877F2" />
            </svg>
          </span>

          <div>
            <h1>FB Location Scrapper</h1>
            <p>Facebook Marketplace Location Scraper</p>
          </div>
        </div>

        <span id="status" class="status-badge" data-status="idle">Siap</span>
      </header>

      <main>
        <section class="card">
          <h2><span class="step-dot">1</span> Input CSV</h2>

          <div class="file-row">
            <input
              id="csvPath"
              type="text"
              placeholder="Pilih file CSV..."
              readonly
            />

            <button id="selectCsv" class="secondary">Pilih CSV</button>
          </div>

          <div class="buttons">
            <button id="startButton" class="primary">▶ Mulai Scraping</button>

            <button id="stopButton" class="danger" disabled>■ Stop</button>
          </div>
        </section>

        <section class="card">
          <div class="section-title">
            <h2><span class="step-dot">2</span> Progress</h2>
          </div>

          <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
          </div>

          <div class="progress-info">
            <span id="progressText">0 / 0 lokasi</span>

            <span id="progressPercent">0%</span>
          </div>
        </section>

        <section class="card card-log">
          <h2><span class="step-dot">3</span> Log Bot</h2>

          <div id="logContainer" class="log-container">
            <div class="log log-info">Sistem siap digunakan.</div>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
